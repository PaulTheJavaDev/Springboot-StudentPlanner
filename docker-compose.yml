services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  backend:
    build: .
    depends_on:
      - db
    ports:
      - "8081:8080"

  frontend:
    build: .
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata: